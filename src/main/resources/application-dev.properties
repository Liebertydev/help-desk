# Configurações que só valem no perfil "dev" (o padrão para quem roda localmente).
# Este arquivo é carregado por cima do application.properties.

# Mostra no console cada SQL que o Hibernate executa. Útil para estudar e depurar,
# mas polui o log e expõe a estrutura do banco: por isso fica fora de produção.
spring.jpa.show-sql=true
