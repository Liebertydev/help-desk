spring.application.name=helpdesk

# Lê o arquivo .env da raiz do projeto (se existir). Cada pessoa do grupo cria
# o seu a partir do .env.example. O "optional:" evita erro quando não há .env.
spring.config.import=optional:file:.env[.properties]

# ${VARIAVEL:padrao} → usa o valor do .env (ou da variável de ambiente);
# se não houver, usa o padrão depois dos dois-pontos.
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Perfil ativo (padrão: dev). O perfil dev roda o DataSeeder com dados de teste.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Desliga o "Open Session in View": as entidades LAZY só podem ser lidas dentro
# dos services (@Transactional). Os controllers recebem DTOs já prontos.
spring.jpa.open-in-view=false

# Endereços do front autorizados a chamar a API (CORS), separados por vírgula.
app.cors.origens=${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}
