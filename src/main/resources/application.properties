spring.application.name=helpdesk

spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Perfil ativo (padrão: dev). O perfil dev roda o DataSeeder com dados de teste.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Desliga o "Open Session in View": as entidades LAZY só podem ser lidas dentro
# dos services (@Transactional). Os controllers recebem DTOs já prontos.
spring.jpa.open-in-view=false
